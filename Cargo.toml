[workspace]
resolver = "2"
members = ["crates/ade-core", "crates/ade-ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
opencode-codes = { version = "1.18", features = ["async-client", "server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
toml = "0.9"
dirs = "6"
portpicker = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

eframe = "0.36"
egui = "0.36"
egui_commonmark = "0.25"
